<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayGround Simple 3D Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #fff;
      pointer-events: none;
    }
    #hud h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff6b35, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #hud p {
      font-size: 14px;
      opacity: 0.8;
    }
    #crosshair {
      position: fixed;
      width: 40px;
      height: 40px;
      top: 50%;
      left: 50%;
      margin: -20px 0 0 -20px;
      pointer-events: none;
    }
    #crosshair svg {
      width: 100%;
      height: 100%;
    }
    #score {
      position: fixed;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 16px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Simple 3D Game</h1>
    <p>Move: WASD | Look: Mouse</p>
  </div>
  <div id="crosshair">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
      <circle cx="12" cy="12" r="8"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="23" x2="12" y2="21"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="23" y1="12" x2="21" y2="12"/>
    </svg>
  </div>
  <div id="score">Score: 0</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Controls (simple FPS-style)
    const keys = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      up: false,
      down: false
    };

    const speed = 0.05;
    const sensitivity = 0.002;

    // Player position tracking
    let yaw = 0;
    let pitch = 0;

    // Input handling
    document.addEventListener('keydown', (e) => {
      switch(e.code) {
        case 'KeyW': keys.forward = true; break;
        case 'KeyS': keys.backward = true; break;
        case 'KeyA': keys.left = true; break;
        case 'KeyD': keys.right = true; break;
        case 'Space': keys.up = true; break;
        case 'ShiftLeft': keys.down = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch(e.code) {
        case 'KeyW': keys.forward = false; break;
        case 'KeyS': keys.backward = false; break;
        case 'KeyA': keys.left = false; break;
        case 'KeyD': keys.right = false; break;
        case 'Space': keys.up = false; break;
        case 'ShiftLeft': keys.down = false; break;
      }
    });

    document.addEventListener('mousemove', (e) => {
      yaw -= e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    // Ground
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d2d3d, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Skybox
    const skyGeo = new THREE.SphereGeometry(50, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({ 
      color: 0x0a0a1e,
      side: THREE.BackSide 
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // Lights
    const ambientLight = new THREE.AmbientLight(0x444488, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // Score
    let score = 0;

    // Collectibles
    const collectibles = [];
    const collectibleCount = 15;

    for (let i = 0; i < collectibleCount; i++) {
      const sizes = [0.5, 0.8, 1.0];
      const size = sizes[Math.floor(Math.random() * sizes.length)];
      
      const shapes = [
        new THREE.SphereGeometry(size, 16, 16),
        new THREE.IcosahedronGeometry(size),
        new THREE.OctahedronGeometry(size)
      ];
      
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
        emissive: new THREE.Color().setHSL(Math.random(), 0.5, 0.3),
        roughness: 0.3,
        metalness: 0.5
      });
      
      const mesh = new THREE.Mesh(shape, material);
      mesh.position.set(
        (Math.random() - 0.5) * 40,
        Math.random() * 10 + 2,
        (Math.random() - 0.5) * 40
      );
      mesh.userData.rotateSpeed = (Math.random() - 0.5) * 0.1;
      mesh.userData.points = 10 + Math.floor(Math.random() * 20);
      scene.add(mesh);
      collectibles.push(mesh);
    }

    // Floor decorations - larger objects
    for (let i = 0; i < 5; i++) {
      const geometry = new THREE.BoxGeometry(
        3 + Math.random() * 2,
        0.5 + Math.random() * 1,
        3 + Math.random() * 2
      );
      const material = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.05 + Math.random() * 0.1, 0.6, 0.4),
        roughness: 0.6
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(
        (Math.random() - 0.5) * 30,
        0.25 + Math.random() * 1,
        (Math.random() - 0.5) * 30
      );
      mesh.rotation.y = Math.random() * Math.PI;
      mesh.userData.points = 50 + Math.floor(Math.random() * 50);
      scene.add(mesh);
    }

    // HUD elements
    const scoreEl = document.getElementById('score');

    // Raycaster for interaction
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    // Game loop
    const clock = new THREE.Clock();

    function update() {
      const delta = clock.getDelta();
      const moveDistance = speed * delta;

      // Movement
      const direction = new THREE.Vector3();
      if (keys.forward) direction.z -= 1;
      if (keys.backward) direction.z += 1;
      if (keys.left) direction.x -= 1;
      if (keys.right) direction.x += 1;
      
      if (direction.length() > 0) {
        direction.normalize();
        // Apply rotation
        const cosY = Math.cos(yaw);
        const sinY = Math.sin(yaw);
        const rotatedX = direction.x * cosY - direction.z * sinY;
        const rotatedZ = direction.x * sinY + direction.z * cosY;
        direction.set(rotatedX, 0, rotatedZ);
        
        camera.position.addScaledVector(direction, moveDistance);
      }

      if (keys.up) {
        camera.position.y += moveDistance;
      }
      if (keys.down) {
        camera.position.y = Math.max(1, camera.position.y - moveDistance);
      }

      // Keep player above ground
      if (camera.position.y < 1.6) {
        camera.position.y = 1.6;
      }

      // Collectible collision
      collectibles.forEach((mesh, index) => {
        const distance = mesh.position.distanceTo(camera.position);
        if (distance < 2.5) {
          score += mesh.userData.points;
          scoreEl.textContent = `Score: ${score}`;
          scene.remove(mesh);
          collectibles.splice(index, 1);
          // Replace with new one
          const newSize = [0.5, 0.8, 1.0][Math.floor(Math.random() * 3)];
          const newShapes = [
            new THREE.SphereGeometry(newSize, 16, 16),
            new THREE.IcosahedronGeometry(newSize),
            new THREE.OctahedronGeometry(newSize)
          ];
          const newMaterial = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
            emissive: new THREE.Color().setHSL(Math.random(), 0.5, 0.3),
            roughness: 0.3,
            metalness: 0.5
          });
          const newMesh = new THREE.Mesh(newShapes[Math.floor(Math.random() * newShapes.length)], newMaterial);
          newMesh.position.set(
            (Math.random() - 0.5) * 40,
            Math.random() * 10 + 2,
            (Math.random() - 0.5) * 40
          );
          newMesh.userData.rotateSpeed = (Math.random() - 0.5) * 0.1;
          newMesh.userData.points = 10 + Math.floor(Math.random() * 20);
          scene.add(newMesh);
          collectibles.push(newMesh);
        }
      });

      // Rotate collectibles
      collectibles.forEach(mesh => {
        mesh.rotation.y += mesh.userData.rotateSpeed * delta;
        mesh.rotation.x += mesh.userData.rotateSpeed * delta * 0.5;
      });

      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
